server:
  port: 8080
  mode: debug

influxdb:
  addr: http://localhost:8086
  username: admin
  password: admin123
  database: sewage_plant
  retention_policy: one_year
  precision: s

mqtt:
  broker: tcp://localhost:1883
  client_id: sewage_server
  username: admin
  password: public
  topic_prefix: sewage/
  qos: 1

websocket:
  read_buffer_size: 1024
  write_buffer_size: 1024
  ping_period: 54s
  pong_wait: 60s
  write_wait: 10s

collector:
  validation_enabled: true
  jump_detection_enabled: true
  max_jump_percent: 50.0
  offline_detection_enabled: true
  offline_threshold_minutes: 10
  channel_buffer_size: 1000

controller:
  aeration:
    do_setpoint: 2.0
    do_min: 1.5
    do_max: 2.5
    nh3_setpoint: 1.5
    nh3_min: 1.0
    nh3_max: 2.0
    pid:
      kp: 0.6
      ki: 0.15
      kd: 0.05
      integral_separation_percent: 20.0
      output_min: 50.0
      output_max: 500.0
    feedforward_gain: 0.8
    control_interval: 30
    min_compute_interval: 5
    event_driven: true
    num_sections: 30
    min_air_flow: 50.0
    max_air_flow: 500.0
    min_valve_open: 10.0
    max_valve_open: 100.0
  carbon:
    tn_removal_target: 0.85
    cod_n_ratio: 4.5
    dosing_max: 150
    control_interval: 60
    min_compute_interval: 300
    cod_change_threshold_pct: 20.0
    bioavailable_cod_ratio: 0.7
    denitrification_eff: 0.85
    naac_cod_equivalent: 0.58

alarm:
  level1:
    nh3_threshold: 5.0
    tn_threshold: 15.0
    duration_minutes: 30
    check_interval: 60
  level2:
    fan_failure_check: true
    sensor_offline_minutes: 10
  sms:
    enabled: true
    api_url: https://sms.example.com/api/send
    api_key: your_sms_api_key
    recipients:
      - "13800138000"
      - "13900139000"

dtu:
  report_interval_seconds: 120
  sensors:
    do: 30
    nh3: 20
    no3: 15
    po4: 10
