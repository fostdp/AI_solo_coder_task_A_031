<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城市污水处理厂精确曝气与脱氮除磷优化系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="header">
        <h1>城市污水处理厂精确曝气与脱氮除磷优化系统</h1>
        <div class="header-info">
            <span>日处理能力: 30万吨</span>
            <span id="current-time"></span>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="panel">
                <h3>关键指标</h3>
                <div class="metric-card power">
                    <div class="metric-label">吨水电耗</div>
                    <div class="metric-value" id="metric-power">0.00</div>
                    <div class="metric-unit">kWh/吨</div>
                </div>
                <div class="metric-card carbon">
                    <div class="metric-label">碳源单耗</div>
                    <div class="metric-value" id="metric-carbon">0.00</div>
                    <div class="metric-unit">kg/千吨</div>
                </div>
                <div class="metric-card removal">
                    <div class="metric-label">总氮去除率</div>
                    <div class="metric-value" id="metric-tn">0.00</div>
                    <div class="metric-unit">%</div>
                </div>
                <div class="metric-card removal-tp">
                    <div class="metric-label">总磷去除率</div>
                    <div class="metric-value" id="metric-tp">0.00</div>
                    <div class="metric-unit">%</div>
                </div>
            </div>

            <div class="panel">
                <h3>指标趋势</h3>
                <div class="trend-selector">
                    <button class="trend-btn active" data-metric="power_consumption">电耗</button>
                    <button class="trend-btn" data-metric="carbon_usage">碳源</button>
                    <button class="trend-btn" data-metric="tn_removal_rate">TN去除</button>
                </div>
                <canvas id="metrics-trend-canvas" width="320" height="200"></canvas>
            </div>

            <div class="panel alarms-panel">
                <h3>告警信息 <span class="alarm-count" id="alarm-count">0</span></h3>
                <div class="alarm-list" id="alarm-list">
                    <div class="no-alarm">暂无告警</div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="tabs">
                <button class="tab-btn active" data-view="profile">生化池剖面图</button>
                <button class="tab-btn" data-view="plan">工艺段平面图</button>
                <button class="tab-btn" data-view="control">曝气控制</button>
            </div>

            <div class="tab-content active" id="view-profile">
                <div class="canvas-container">
                    <canvas id="profile-canvas" width="950" height="1050"></canvas>
                </div>
            </div>

            <div class="tab-content" id="view-plan">
                <div class="canvas-container">
                    <canvas id="plan-canvas" width="950" height="600"></canvas>
                </div>
            </div>

            <div class="tab-content" id="view-control">
                <div class="control-panel">
                    <div class="control-section">
                        <h3>曝气控制参数</h3>
                        <div class="control-grid">
                            <div class="control-item">
                                <label>DO设定值: <span id="do-setpoint">2.0</span> mg/L</label>
                                <input type="range" id="do-slider" min="1.0" max="3.0" step="0.1" value="2.0">
                            </div>
                            <div class="control-item">
                                <label>NH3设定值: <span id="nh3-setpoint">1.5</span> mg/L</label>
                                <input type="range" id="nh3-slider" min="0.5" max="3.0" step="0.1" value="1.5">
                            </div>
                            <div class="control-item">
                                <label>Kp: <span id="kp-value">0.6</span></label>
                                <input type="range" id="kp-slider" min="0.1" max="2.0" step="0.1" value="0.6">
                            </div>
                            <div class="control-item">
                                <label>Ki: <span id="ki-value">0.15</span></label>
                                <input type="range" id="ki-slider" min="0.01" max="0.5" step="0.01" value="0.15">
                            </div>
                            <div class="control-item">
                                <label>Kd: <span id="kd-value">0.05</span></label>
                                <input type="range" id="kd-slider" min="0.01" max="0.2" step="0.01" value="0.05">
                            </div>
                        </div>
                        <button id="apply-aeration" class="btn-primary">应用曝气参数</button>
                    </div>

                    <div class="control-section">
                        <h3>碳源投加控制</h3>
                        <div class="control-grid">
                            <div class="control-item">
                                <label>总氮去除目标: <span id="tn-target">85</span>%</label>
                                <input type="range" id="tn-target-slider" min="70" max="95" step="1" value="85">
                            </div>
                        </div>
                        <div class="dosing-status">
                            <div>当前投加量: <span id="dosing-rate">0</span> mg/L</div>
                            <div>实际投加量: <span id="dosing-actual">0</span> mg/L</div>
                            <div>预计TN去除: <span id="tn-removal">0</span>%</div>
                        </div>
                        <button id="apply-carbon" class="btn-primary">应用碳源参数</button>
                    </div>

                    <div class="control-section">
                        <h3>各段曝气状态</h3>
                        <div class="aeration-status" id="aeration-status">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="trend-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">传感器趋势</h3>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="trend-info" id="trend-info"></div>
                <canvas id="trend-canvas" width="800" height="400"></canvas>
            </div>
        </div>
    </div>

    <div class="legend">
        <h4>图例</h4>
        <div class="legend-items">
            <div class="legend-item"><span class="legend-dot green"></span> 正常 (<10%)</div>
            <div class="legend-item"><span class="legend-dot yellow"></span> 预警 (10%-20%)</div>
            <div class="legend-item"><span class="legend-dot red"></span> 报警 (>20%)</div>
            <div class="legend-item"><span class="legend-dot gray"></span> 离线</div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/bioreactor_profile.js"></script>
    <script src="js/sensor_trend.js"></script>
    <script src="js/control.js"></script>
    <script src="js/alarm.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
