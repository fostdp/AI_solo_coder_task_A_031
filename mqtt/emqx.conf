## EMQX Broker Configuration

## Allow anonymous authentication by default if no other auth module is loaded
## Value: true | false
allow_anonymous = true

## The default authentication mechanism, allow to configure a static list of credentials
## If allow_anonymous = true, this will be ignored
## auth.user.1.username = admin
## auth.user.1.password = admin123

##--------------------------------------------------------------------
## MQTT Listeners
##--------------------------------------------------------------------

listener.tcp.default.bind = 0.0.0.0:1883
listener.tcp.default.acceptors = 16
listener.tcp.default.max_connections = 102400

listener.ssl.external.bind = 8883
listener.ssl.external.acceptors = 16
listener.ssl.external.max_connections = 102400
listener.ssl.external.certfile = etc/certs/cert.pem
listener.ssl.external.keyfile = etc/certs/key.pem

listener.ws.external.bind = 0.0.0.0:8083
listener.ws.external.acceptors = 16
listener.ws.external.max_connections = 102400

listener.wss.external.bind = 8084
listener.wss.external.acceptors = 16
listener.wss.external.max_connections = 102400
listener.wss.external.certfile = etc/certs/cert.pem
listener.wss.external.keyfile = etc/certs/key.pem

##--------------------------------------------------------------------
## MQTT Parameters
##--------------------------------------------------------------------

## Maximum QoS level for incoming messages
## Value: 0 | 1 | 2
mqtt.max_qos_allowed = 2

## Maximum MQTT Topic Alias
## Value: 0 ~ 65535
mqtt.topic_alias_maximum = 65535

## Retry interval for QoS 1/2 messages
## Value: Duration
mqtt.retry_interval = 15s

## Maximum number of QoS 1 and 2 messages that can be in-flight at any given time
## Value: Integer >= 0, 0 means no limit
mqtt.max_inflight = 100

## Message queue for QoS 1/2 messages that are awaiting acknowledgement
## Messages will be queued when the connection is offline
## Value: Integer >= 0, 0 means no limit
mqtt.mqueue_max_len = 1000

## Maximum MQTT packet size allowed
## Value: Byte Size
mqtt.max_packet_size = 1MB

## Session expiry interval for MQTT 5.0 clients
## Value: Duration
## 0 means the session will expire immediately when the connection is closed
## undefined means never expire
mqtt.session_expiry_interval = 2h

## The default expiration interval for the message when it has no 'expiry_interval' property
## Value: Duration
## undefined means never expire
mqtt.message_expiry_interval = 1h

##--------------------------------------------------------------------
## QoS 1 Configuration
##--------------------------------------------------------------------

## Guarantee QoS 1 message delivery
## When enabled, EMQX will ensure QoS 1 messages are delivered at least once
mqtt.qos1_guarantee = true

## Number of retries for QoS 1 messages before considering them failed
## Value: Integer >= 0
mqtt.qos1_max_retries = 3

## Timeout for QoS 1 message acknowledgement
## Value: Duration
mqtt.qos1_ack_timeout = 30s

##--------------------------------------------------------------------
## Persistence
##--------------------------------------------------------------------

## Enable message persistence for QoS 1/2 messages
persistence = true

## Persistence storage backend
## Value: mnesia | mysql | pgsql | redis
persistence.storage = mnesia

##--------------------------------------------------------------------
## MQTT Protocol Options
##--------------------------------------------------------------------

## Client idle timeout
## Value: Duration
mqtt.idle_timeout = 30s

## Keepalive interval
## Value: Duration
mqtt.keepalive = 60s

##--------------------------------------------------------------------
## Load Configuration
##--------------------------------------------------------------------

## Load all plugins from the plugins directory
## plugins.load_file = etc/loaded_plugins

##--------------------------------------------------------------------
## Logging
##--------------------------------------------------------------------

## Log level
## Value: debug | info | notice | warning | error | critical | alert | emergency
log.level = info

## Log file path
## Value: File Path
log.file = log/emqx.log

## Enable console log
## Value: true | false
log.console = true

##--------------------------------------------------------------------
## Flapping Detection
##--------------------------------------------------------------------

## Detect flapping clients
flapping_detect.enable = true
flapping_detect.max_count = 15
flapping_detect.window_time = 1m
flapping_detect.ban_time = 5m

##--------------------------------------------------------------------
## Rate Limit
##--------------------------------------------------------------------

## Limit the number of messages per second for each client
## Value: Number, 0 means no limit
rate_limit.messages = 0

## Limit the message size per second for each client
## Value: Byte Size, 0 means no limit
rate_limit.bytes = 0
