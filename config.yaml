server:
  port: "8080"

influxdb:
  addr: "http://localhost:8086"
  username: "admin"
  password: "admin"
  database: "sewage"

mqtt:
  broker: "tcp://localhost:1883"
  client_id: "sewage_backend"
  username: ""
  password: ""
  topic: "sewage/sensor/+"
  cmd_topic: "sewage/command"

control:
  aeration:
    nh3_target_min: 1.0
    nh3_target_max: 2.0
    do_target_min: 1.5
    do_target_max: 2.5
    pid_kp: 0.8
    pid_ki: 0.1
    pid_kd: 0.05
    control_interval: 30
  carbon:
    tn_target: 15.0
    cod_per_carbon_unit: 1.06
    control_interval: 60

alarm:
  level1:
    nh3_threshold: 5.0
    tn_threshold: 15.0
    duration_minutes: 30
  level2:
    offline_minutes: 5
  sms:
    api_key: ""
    api_secret: ""
    phones:
      - "13800138000"
      - "13900139000"
