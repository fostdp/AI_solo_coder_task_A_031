version: '3.8'

services:
  influxdb:
    image: influxdb:1.8.10
    container_name: sewage-influxdb
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      - INFLUXDB_DB=${INFLUXDB_DB:-sewage}
      - INFLUXDB_ADMIN_USER=${INFLUXDB_USER:-admin}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_PASSWORD:-admin123}
      - INFLUXDB_HTTP_AUTH_ENABLED=false
      - INFLUXDB_RETENTION_ENABLED=true
      - INFLUXDB_DATA_INDEX_VERSION=tsi1
    volumes:
      - influxdb-data:/var/lib/influxdb
      - ./scripts/influxdb/init.iql:/docker-entrypoint-initdb.d/init.iql:ro
      - ./config/influxdb/influxdb.conf:/etc/influxdb/influxdb.conf:ro
    command: influxd -config /etc/influxdb/influxdb.conf
    networks:
      - sewage-net
    healthcheck:
      test: ["CMD", "influx", "-execute", "SHOW DATABASES"]
      interval: 30s
      timeout: 10s
      retries: 3

  mqtt-broker:
    image: eclipse-mosquitto:2.0.18
    container_name: sewage-mqtt
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - sewage-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t 'test' -m 'ping' -q 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  go-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sewage-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
      - "${PPROF_PORT:-6060}:6060"
    environment:
      - CONFIG_FILE=/app/config.yaml
      - INFLUXDB_ADDR=http://influxdb:8086
      - INFLUXDB_DB=${INFLUXDB_DB:-sewage}
      - MQTT_BROKER=tcp://mqtt-broker:1883
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - PPROF_ENABLED=true
      - PPROF_PORT=6060
      - TZ=Asia/Shanghai
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
    depends_on:
      influxdb:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    networks:
      - sewage-net

  dtu-simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sewage-dtu-sim
    restart: unless-stopped
    environment:
      - API_URL=http://go-server:8080/api/v1
      - REPORT_INTERVAL=${DTU_REPORT_INTERVAL:-120}
      - SENSOR_COUNT=${DTU_SENSOR_COUNT:-75}
      - WATER_QUALITY_FLUCTUATION=${WATER_QUALITY_FLUCTUATION:-0.3}
      - TZ=Asia/Shanghai
    entrypoint: ["/app/dtu-simulator"]
    depends_on:
      - go-server
    networks:
      - sewage-net

  plc-simulator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sewage-plc-sim
    restart: unless-stopped
    environment:
      - MQTT_BROKER=tcp://mqtt-broker:1883
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX:-sewage/}
      - TZ=Asia/Shanghai
    entrypoint: ["/app/plc-simulator"]
    depends_on:
      mqtt-broker:
        condition: service_healthy
    networks:
      - sewage-net

  frontend:
    image: nginx:alpine
    container_name: sewage-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - go-server
    networks:
      - sewage-net

volumes:
  influxdb-data:
  mqtt-data:
  mqtt-log:

networks:
  sewage-net:
    driver: bridge
