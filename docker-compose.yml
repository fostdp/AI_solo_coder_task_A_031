version: '3.8'

services:
  influxdb:
    image: influxdb:1.8.10
    container_name: sewage-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb
      - ./influxdb/influxdb.conf:/etc/influxdb/influxdb.conf:ro
      - ./influxdb/init.iql:/docker-entrypoint-initdb.d/init.iql:ro
    environment:
      - INFLUXDB_DB=sewage_plant
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
      - INFLUXDB_USER=writer
      - INFLUXDB_USER_PASSWORD=writer123
      - INFLUXDB_READ_USER=reader
      - INFLUXDB_READ_USER_PASSWORD=reader123
      - INFLUXDB_CONFIG_PATH=/etc/influxdb/influxdb.conf
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sewage-network

  emqx:
    image: emqx/emqx:5.3.2
    container_name: sewage-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8084:8084"
      - "8883:8883"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
      - ./mqtt/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    environment:
      - EMQX_NAME=sewage-emqx
      - EMQX_HOST=emqx
      - EMQX_NODE_NAME=emqx@emqx
      - EMQX_ALLOW_ANONYMOUS=true
      - EMQX_MQTT__MAX_QOS_ALLOWED=2
      - EMQX_MQTT__RETRY_INTERVAL=15s
      - EMQX_MQTT__MAX_INFLIGHT=100
      - EMQX_MQTT__MQUEUE_MAX_LEN=1000
      - EMQX_MQTT__QOS1_GUARANTEE=true
      - EMQX_MQTT__QOS1_MAX_RETRIES=3
      - EMQX_MQTT__QOS1_ACK_TIMEOUT=30s
      - EMQX_PERSISTENCE=true
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sewage-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VERSION: 1.0.0
    container_name: sewage-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_FILE=/app/config.yaml
      - SERVER_PORT=8080
      - SERVER_MODE=release
      - INFLUXDB_ADDR=http://influxdb:8086
      - INFLUXDB_USERNAME=admin
      - INFLUXDB_PASSWORD=admin123
      - INFLUXDB_DATABASE=sewage_plant
      - INFLUXDB_RETENTION_POLICY=raw_data
      - MQTT_BROKER=tcp://emqx:1883
      - MQTT_CLIENT_ID=sewage_server
      - MQTT_USERNAME=admin
      - MQTT_PASSWORD=public
      - WEBSOCKET_PORT=8081
      - PPROF_ENABLED=true
    depends_on:
      influxdb:
        condition: service_healthy
      emqx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - sewage-network

  sensor-simulator:
    build:
      context: ./simulators
      dockerfile: Dockerfile.sensor
    container_name: sewage-sensor-sim
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - MQTT_BROKER=emqx
      - MQTT_PORT=1883
      - MQTT_USERNAME=admin
      - MQTT_PASSWORD=public
      - MQTT_QOS=1
      - REPORT_INTERVAL=120
      - WATER_QUALITY_FLUCTUATION=1.0
      - FAULT_SIMULATION_ENABLED=true
      - DRIFT_SIMULATION_ENABLED=true
      - SENSORS_PER_DTU=10
      - DO_SENSOR_COUNT=28
      - NH3_SENSOR_COUNT=18
      - NO3_SENSOR_COUNT=12
      - PO4_SENSOR_COUNT=10
      - COD_SENSOR_COUNT=5
      - FLOW_SENSOR_COUNT=2
      - DO_BASE_AEROBIC1=2.5
      - NH3_BASE_AEROBIC1=15.0
      - COD_BASE_INFLUENT=350.0
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - sewage-network

  plc-simulator:
    build:
      context: ./simulators
      dockerfile: Dockerfile.plc
    container_name: sewage-plc-sim
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - MQTT_BROKER=emqx
      - MQTT_PORT=1883
      - MQTT_USERNAME=admin
      - MQTT_PASSWORD=public
      - MQTT_QOS=1
      - STATUS_TOPIC_QOS=1
      - REPORT_INTERVAL=5
      - FAULT_SIMULATION_ENABLED=true
      - RESPONSE_TIME=0.5
      - CONTROL_TOPIC=control/+/+
      - STATUS_TOPIC=plc/{plc_id}/status
      - FEEDBACK_TOPIC=plc/{plc_id}/feedback
    depends_on:
      emqx:
        condition: service_healthy
    networks:
      - sewage-network

  frontend:
    image: nginx:1.25-alpine
    container_name: sewage-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sewage-network

volumes:
  influxdb-data:
    name: sewage-influxdb-data
  emqx-data:
    name: sewage-emqx-data
  emqx-log:
    name: sewage-emqx-log

networks:
  sewage-network:
    name: sewage-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
